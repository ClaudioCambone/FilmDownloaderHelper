services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: telegram-qbittorrent
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/Rome}
      WEBUI_PORT: 8080
      TORRENTING_PORT: 6881
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - qbittorrent_config:/config
      - type: bind
        source: ${MOVIES_PATH}
        target: /downloads/movies
      - type: bind
        source: ${TV_PATH}
        target: /downloads/tv
    networks:
      - app-network

  bot:
    build: .
    container_name: telegram-download-assistant
    restart: unless-stopped
    depends_on:
      - qbittorrent
    env_file:
      - .env
    environment:
      QBIT_URL: http://qbittorrent:8080
      MOVIES_PATH: /downloads/movies
      TV_PATH: /downloads/tv
      NODE_ENV: production
    networks:
      - app-network

volumes:
  qbittorrent_config:

networks:
  app-network:
    driver: bridge
